version: "3.9"

# ═══════════════════════════════════════════════════════════════
# TaskFlow — Docker Compose
# Usage: docker compose up --build
# ═══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL (production-like local DB) ──────────────────
  db:
    image: postgres:15-alpine
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-taskmanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      APP_NAME:                   "Task Manager API"
      ENVIRONMENT:                production
      DEBUG:                      "false"
      SECRET_KEY:                 ${SECRET_KEY:-supersecretkey-change-in-prod-32chars}
      DATABASE_URL:               postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow_secret}@db:5432/${POSTGRES_DB:-taskmanager}
      CORS_ORIGINS:               '["http://localhost","http://localhost:80","http://frontend"]'
      RATE_LIMIT_PER_MINUTE:      "60"
      FIRST_ADMIN_EMAIL:          ${FIRST_ADMIN_EMAIL:-admin@taskmanager.com}
      FIRST_ADMIN_PASSWORD:       ${FIRST_ADMIN_PASSWORD:-Admin@123456}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      UPLOAD_DIR:                 "uploads"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - taskflow-net

  # ── Nginx Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend.Dockerfile
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskflow-net

# ── Volumes ────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  taskflow-net:
    driver: bridge
