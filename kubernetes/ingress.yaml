# ─────────────────────────────────────────────────────────────────
# Ingress — requires nginx-ingress-controller to be installed.
# Install: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
# For local testing with minikube: minikube addons enable ingress
# ─────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-ingress
  namespace: taskflow
  labels:
    app: taskflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # TLS — enable cert-manager for automatic HTTPS certificates
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # Uncomment to enable TLS
  # tls:
  #   - hosts:
  #       - taskflow.example.com
  #     secretName: taskflow-tls
  rules:
    - host: taskflow.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskflow-backend-svc
                port:
                  number: 8000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: taskflow-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow-frontend-svc
                port:
                  number: 80
