# ─────────────────────────────────────────────────────────────────
# Render Blueprint — defines all services for render.com deployment
# Docs: https://render.com/docs/blueprint-spec
# Deploy: Connect GitHub repo → Render auto-detects this file
# ─────────────────────────────────────────────────────────────────

services:
  # ── FastAPI Backend ──────────────────────────────────────────
  - type: web
    name: taskflow-backend
    runtime: docker
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: ./backend
    plan: free            # free, starter, standard, pro
    region: oregon
    branch: main
    autoDeploy: true         # deploy on every push to main
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Task Manager API"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true   # Render generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://taskflow-frontend.onrender.com"]'
      - key: FIRST_ADMIN_EMAIL
        value: admin@taskmanager.com
      - key: FIRST_ADMIN_PASSWORD
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: UPLOAD_DIR
        value: uploads
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1

  # ── Static Frontend (HTML/CSS/JS via Nginx) ──────────────────
  - type: web
    name: taskflow-frontend
    runtime: docker
    dockerfilePath: ./docker/frontend.Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health

databases:
  # ── PostgreSQL ───────────────────────────────────────────────
  - name: taskflow-db
    plan: starter             # 256MB RAM, 1GB storage on free tier
    databaseName: taskmanager
    user: taskflow
    region: oregon
    postgresMajorVersion: 15
